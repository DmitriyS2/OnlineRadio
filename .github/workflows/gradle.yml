name: CI

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build Debug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build Release
        run: |
          ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk

      - name: Show APK filenames
        run: |
          echo "Debug APK:"
          ls app/build/outputs/apk/debug/*.apk | xargs -n1 basename
          echo ""
          echo "Release APK:"
          ls app/build/outputs/apk/release/*.apk | xargs -n1 basename